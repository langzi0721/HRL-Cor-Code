[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrl-cor-reproduction"
version = "0.1.0"
description = "Cached molecular representation experiments for ZE41 corrosion inhibition"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
